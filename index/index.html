<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --rose: #d4736e;
        --rose-soft: #e8a9a5;
        --cream: #fdf8f4;
        --text: #3a2e2b;
        --text-soft: #6b5a56;
      }
      html { font-size: 18px; }
      body {
        font-family: 'Cormorant Garamond', Georgia, serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::after {
        content: '';
        position: fixed; inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 100;
      }
      .screen {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      .screen.active { opacity: 1; visibility: visible; }
      .container { max-width: 640px; padding: 2rem; text-align: center; }
      .subtitle {
        font-size: 0.85rem; letter-spacing: 0.25em; text-transform: lowercase;
        color: var(--rose-soft); margin-bottom: 1rem; font-style: italic;
      }
      .dear {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.3rem; font-weight: 400; font-style: italic;
        color: var(--rose); margin-bottom: 2.5rem;
        letter-spacing: 0.05em;
      }
      .question {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2rem; font-weight: 400; line-height: 1.55;
        color: var(--text); margin-bottom: 3rem;
      }
      .highlight { color: var(--rose); font-style: italic; }
      .buttons { display: flex; gap: 1.5rem; justify-content: center; align-items: center; flex-wrap: wrap; }
      .btn {
        font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 500;
        letter-spacing: 0.08em; padding: 0.85rem 2.8rem; border: none; border-radius: 50px;
        cursor: pointer; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden;
      }
      .btn::after {
        content: ''; position: absolute; inset: 0;
        background: rgba(255,255,255,0.15); opacity: 0; transition: opacity 0.3s ease;
      }
      .btn:hover::after { opacity: 1; }
      .btn-yes {
        background: var(--rose); color: white;
        box-shadow: 0 4px 20px rgba(212,115,110,0.35);
      }
      .btn-yes:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(212,115,110,0.45);
      }
      .btn-no {
        background: transparent; color: var(--text-soft);
        border: 1.5px solid var(--rose-soft); min-width: 130px; min-height: 48px;
      }
      .btn-no:hover { border-color: var(--rose); color: var(--rose); }
      .heart-burst {
        font-size: 5rem; color: var(--rose);
        animation: heartbeat 1.2s ease-in-out infinite, floatUp 0.8s ease-out forwards;
        margin-bottom: 2rem;
      }
      @keyframes heartbeat {
        0%,100% { transform: scale(1); } 15% { transform: scale(1.15); }
        30% { transform: scale(1); } 45% { transform: scale(1.1); }
      }
      @keyframes floatUp {
        from { opacity: 0; transform: translateY(30px) scale(0.5); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .happy-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2.2rem; font-weight: 400; line-height: 1.4;
        color: var(--text); margin-bottom: 1.5rem;
        animation: fadeInUp 0.8s ease-out 0.3s both;
      }
      .happy-text {
        font-size: 1.25rem; line-height: 1.8; color: var(--text-soft);
        animation: fadeInUp 0.8s ease-out 0.6s both;
      }
      .happy-text em { color: var(--rose); font-style: italic; }
      .love-note { margin-top: 3rem; animation: fadeInUp 0.8s ease-out 1s both; }
      .love-note p { font-size: 1rem; letter-spacing: 0.15em; color: var(--rose-soft); font-style: italic; }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-delay-1 { animation: fadeInUp 0.7s ease-out 0.2s both; }
      .fade-in-delay-2 { animation: fadeInUp 0.7s ease-out 0.5s both; }
      .fade-in-delay-3 { animation: fadeInUp 0.7s ease-out 0.9s both; }
      .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
      .floating-heart {
        position: absolute; color: var(--rose-soft); opacity: 0.12;
        animation: float linear infinite; font-size: 1rem;
      }
      @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 0.12; } 90% { opacity: 0.12; }
        100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
      }
      .celebration-heart {
        position: fixed; font-size: 1.5rem; pointer-events: none; z-index: 50;
        animation: celebrationFloat 2s ease-out forwards;
      }
      @keyframes celebrationFloat {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-200px) scale(0.3); }
      }
      @media (max-width: 600px) {
        html { font-size: 16px; }
        .question { font-size: 1.6rem; }
        .happy-title { font-size: 1.8rem; }
        .container { padding: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hearts-bg" id="hearts-bg"></div>

      <div class="screen active" id="screen-question">
        <div class="container">
          <p class="subtitle fade-in-delay-1">a little question for you...</p>
          <p class="dear fade-in-delay-1">Dear Karolini,</p>
          <h1 class="question fade-in-delay-2">
            Can you stop being mad at your <span class="highlight">beautiful</span> <span class="highlight">strong</span> husband and love him forever?
          </h1>
          <div class="buttons fade-in-delay-3">
            <button class="btn btn-yes" id="btn-yes">Yes</button>
            <button class="btn btn-no" id="btn-no">No</button>
          </div>
        </div>
      </div>

      <div class="screen" id="screen-happy">
        <div class="container">
          <div class="heart-burst">♥</div>
          <h1 class="happy-title">You just made me the happiest man alive</h1>
          <p class="happy-text">
            I love you more than all the stars in the Norwegian sky.<br>
            You are my everything, <em>min kjærlighet</em>.
          </p>
          <div class="love-note"><p>forever yours ♥</p></div>
        </div>
      </div>
    </div>

    <script>
      const heartsBg = document.getElementById('hearts-bg');
      const heartChars = ['♥', '♡', '❤', '❥'];

      function createFloatingHeart() {
        const h = document.createElement('span');
        h.classList.add('floating-heart');
        h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
        h.style.left = Math.random() * 100 + '%';
        h.style.fontSize = (Math.random() * 1.2 + 0.6) + 'rem';
        h.style.animationDuration = (Math.random() * 8 + 10) + 's';
        h.style.animationDelay = (Math.random() * 2) + 's';
        heartsBg.appendChild(h);
        setTimeout(() => h.remove(), 20000);
      }
      for (let i = 0; i < 12; i++) setTimeout(createFloatingHeart, i * 600);
      setInterval(createFloatingHeart, 2500);

      const btnYes = document.getElementById('btn-yes');
      const btnNo = document.getElementById('btn-no');
      const screenQuestion = document.getElementById('screen-question');
      const screenHappy = document.getElementById('screen-happy');
      let noClickCount = 0;

      btnYes.addEventListener('click', () => showHappyScreen());

      btnNo.addEventListener('click', () => {
        noClickCount++;
        if (noClickCount === 1) {
          btnNo.classList.add('shrinking');
          btnNo.style.transform = 'scale(0.75)';
          btnNo.style.opacity = '0.7';
          btnNo.style.fontSize = '0.95rem';
          btnNo.style.padding = '0.65rem 2rem';
          btnYes.style.transform = 'scale(1.08)';
          btnYes.style.boxShadow = '0 8px 30px rgba(212,115,110,0.5)';
        } else {
          btnNo.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
          btnNo.style.transform = 'scale(0.3) rotate(-10deg)';
          btnNo.style.opacity = '0';
          setTimeout(() => {
            btnNo.textContent = 'Yes ♥';
            btnNo.style.background = 'var(--rose)';
            btnNo.style.color = 'white';
            btnNo.style.borderColor = 'var(--rose)';
            btnNo.style.transform = 'scale(1) rotate(0deg)';
            btnNo.style.opacity = '1';
            btnNo.style.boxShadow = '0 4px 20px rgba(212,115,110,0.35)';
            btnNo.onclick = () => showHappyScreen();
          }, 400);
        }
      });

      function showHappyScreen() {
        screenQuestion.classList.remove('active');
        for (let i = 0; i < 20; i++) setTimeout(() => spawnCelebrationHeart(), i * 100);
        setTimeout(() => screenHappy.classList.add('active'), 300);
      }

      function spawnCelebrationHeart() {
        const h = document.createElement('span');
        h.classList.add('celebration-heart');
        h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
        h.style.left = (Math.random() * 80 + 10) + '%';
        h.style.top = (Math.random() * 60 + 20) + '%';
        h.style.color = 'hsl(' + (Math.random() * 20 + 350) + ', 70%, ' + (Math.random() * 20 + 60) + '%)';
        h.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2200);
      }
    </script>

</html>
