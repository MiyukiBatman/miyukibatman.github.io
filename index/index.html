<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#ffe8ef,#fff8fa 55%,#ffffff);
}

.card{
width:90%;
max-width:650px;
background:rgba(255,255,255,.75);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.7);
border-radius:32px;
padding:55px;
text-align:center;
box-shadow:0 20px 60px rgba(255,120,160,.18);
animation:fade .8s ease;
z-index:10;
}

.flag{
font-size:48px;
margin-bottom:15px;
animation:float 3s ease-in-out infinite;
}

h1{
font-size:48px;
font-weight:700;
color:#222;
margin-bottom:18px;
}

p{
font-size:20px;
color:#666;
margin-bottom:40px;
line-height:1.6;
}

.buttons{
display:flex;
justify-content:center;
gap:18px;
}

button{
border:none;
padding:18px 42px;
border-radius:999px;
font-size:19px;
font-weight:600;
cursor:pointer;
transition:.35s;
}

#yes{
background:#ff5d8f;
color:white;
box-shadow:0 10px 25px rgba(255,93,143,.4);
}

#yes:hover{
transform:translateY(-4px) scale(1.05);
}

#no{
background:#ececec;
color:#444;
}

#no:hover{
transform:translateY(-2px);
}

.success{
animation:pop .6s;
}

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-40px;
font-size:24px;
animation:rise linear forwards;
opacity:.8;
}

@keyframes rise{
to{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

@keyframes float{
50%{transform:translateY(-6px);}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(25px);
}
}

@keyframes pop{
0%{transform:scale(.8);}
60%{transform:scale(1.08);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="card" id="card">

<div class="flag">🇳🇴</div>

<h1>Do you wanna be mine?</h1>

<p>
From the very first moment, you made my days brighter.<br><br>
I really like you... ❤️<br>
So I have just one question.
</p>

<div class="buttons">
<button id="yes">Yes ❤️</button>
<button id="no">No</button>
</div>

</div>

<script>

const yes=document.getElementById("yes");
const no=document.getElementById("no");
const card=document.getElementById("card");

let clicks=0;

no.onclick=()=>{

clicks++;

if(clicks==1){

no.style.transform="scale(.55)";
no.style.opacity=".8";

}

else{

no.textContent="Yes ❤️";
no.id="yes2";
no.style.background="#ff5d8f";
no.style.color="white";
no.style.transform="scale(1)";
no.onclick=success;

}

};

yes.onclick=success;

function success(){

card.classList.add("success");

card.innerHTML=`
<div class="flag">🇳🇴 ❤️</div>

<h1>YAY!! 🥹❤️</h1>

<p>
You just made me the happiest person.<br><br>
I promise to do my best to make you smile every day.<br><br>
I really, really like you. ❤️
</p>
`;

setInterval(makeHeart,180);

}

function makeHeart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML=Math.random()>0.5?"❤️":"💕";

h.style.left=Math.random()*100+"%";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.fontSize=(18+Math.random()*28)+"px";

document.getElementById("hearts").appendChild(h);

setTimeout(()=>h.remove(),8000);

}

setInterval(makeHeart,600);

</script>

</body>
</html>
